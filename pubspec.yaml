name: medisom_console
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ^3.6.0
dependencies:
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.0.0
  permission_handler: ^12.0.0
  webview_flutter: ^4.0.0
  url_launcher: ^6.0.0
  mobile_scanner: ^7.0.0
  http: ^1.0.0
  shared_preferences: ^2.0.0
  web: any
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.2.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/images/Logo_medisom_icon.png
  image_path: assets/images/Logo_medisom_icon.png
  remove_alpha_ios: true
